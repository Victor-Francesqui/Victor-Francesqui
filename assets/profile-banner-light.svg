<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dev Francesqui — Desenvolvedor de software">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0B1B28" stroke-opacity=".06"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <radialGradient id="glowA" cx="84%" cy="12%" r="55%"><stop stop-color="#8B7CFF" stop-opacity=".22"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="4%" cy="100%" r="50%"><stop stop-color="#31D4CE" stop-opacity=".20"/><stop offset="1" stop-color="#31D4CE" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31D4CE"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',monospace}
    .l{animation:in .35s ease both}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.3s}.d4{animation-delay:1.8s}.d5{animation-delay:2.4s}.d6{animation-delay:2.9s}.d7{animation-delay:3.4s}
    @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 8s linear infinite}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(340px)}}
    @media (prefers-reduced-motion:reduce){.l,.cur,.scan{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#F6F9FB"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#m)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect class="scan" width="1200" height="2" fill="#31D4CE" opacity=".16"/>
    <g class="mono">
      <text x="60" y="98" font-size="15" fill="#0F7F7B">// sistemas web · APIs · integrações</text>
      <text x="58" y="158" font-size="52" font-weight="700" letter-spacing="-1" fill="#071521">Dev Francesqui</text>
      <text x="60" y="198" font-size="21" fill="#4F6070">Desenvolvedor de software<tspan fill="#0F7F7B" class="cur">_</tspan></text>
      <rect x="60" y="218" width="140" height="4" rx="2" fill="url(#accent)"/>
      <g font-size="13" fill="#27394A" text-anchor="middle">
        <rect x="60" y="246" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#CFDAE2"/><text x="112" y="265">TypeScript</text>
        <rect x="174" y="246" width="56" height="28" rx="6" fill="#FFFFFF" stroke="#CFDAE2"/><text x="202" y="265">PHP</text>
        <rect x="240" y="246" width="56" height="28" rx="6" fill="#FFFFFF" stroke="#CFDAE2"/><text x="268" y="265">SQL</text>
        <rect x="306" y="246" width="72" height="28" rx="6" fill="#FFFFFF" stroke="#CFDAE2"/><text x="342" y="265">React</text>
        <rect x="388" y="246" width="80" height="28" rx="6" fill="#FFFFFF" stroke="#CFDAE2"/><text x="428" y="265">NestJS</text>
      </g>
    </g>
    <g class="mono">
      <rect x="690" y="44" width="456" height="240" rx="12" fill="#0C1D2B" stroke="#1B3040"/>
      <path d="M690 56a12 12 0 0 1 12-12h432a12 12 0 0 1 12 12v18H690z" fill="#102433"/>
      <circle cx="712" cy="60" r="5.5" fill="#F06464"/><circle cx="730" cy="60" r="5.5" fill="#F4B740"/><circle cx="748" cy="60" r="5.5" fill="#2ECC8F"/>
      <text x="918" y="64" font-size="12" fill="#8A97A3" text-anchor="middle">victor@dev: ~</text>
      <g font-size="14">
        <text class="l d1" x="712" y="106"><tspan fill="#31D4CE">$</tspan><tspan dx="9" fill="#F3F6F8">whoami</tspan></text>
        <text class="l d2" x="712" y="130" fill="#9BA6AE">victor-francesqui</text>
        <text class="l d3" x="712" y="162"><tspan fill="#31D4CE">$</tspan><tspan dx="9" fill="#F3F6F8">cat stack.json | jq .core</tspan></text>
        <text class="l d4" x="712" y="186" fill="#B9B0FF">["ts","php","react","nestjs","sql"]</text>
        <text class="l d5" x="712" y="218"><tspan fill="#31D4CE">$</tspan><tspan dx="9" fill="#F3F6F8">ls ~/projetos</tspan></text>
        <text class="l d6" x="712" y="242" fill="#9BA6AE">nexflow · siscredit · creditall · wulfy</text>
        <text class="l d7" x="712" y="270"><tspan fill="#31D4CE">$</tspan><tspan dx="9" fill="#F3F6F8" class="cur">_</tspan></text>
      </g>
    </g>
    <rect y="318" width="1200" height="2" fill="url(#accent)" opacity=".7"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" fill="none" stroke="#D5DEE6"/>
</svg>
