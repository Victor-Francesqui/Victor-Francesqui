name: Generate profile activity

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test activity card generator
        run: python3 -m unittest discover -s tests

      - name: Generate activity cards
        run: python3 scripts/generate_activity_card.py --login Victor-Francesqui --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Victor-Francesqui
          outputs: dist/github-snake-raw.svg

      - name: Apply Matrix theme to the snake
        run: python3 scripts/theme_snake.py --input dist/github-snake-raw.svg --output dist/github-snake-matrix.svg

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
