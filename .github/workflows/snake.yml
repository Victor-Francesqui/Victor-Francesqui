name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Victor-Francesqui
          outputs: |
            dist/github-snake.svg?color_snake=%236758D6&color_dots=%23F4F6FA,%23D9D2F4,%23AAA0EE,%237B69DE,%234E3BB8
            dist/github-snake-dark.svg?color_snake=%238B7CFF&color_dots=%230C1620,%23134446,%23176A69,%232AA4A0,%2331D4CE

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
